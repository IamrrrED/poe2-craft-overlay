<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face { font-family: Fontin; src: url('fontin-regular-webfont.ttf'); }
:root { --text:#d6cfc0; --dim:#9a8d70; --magic:#a8a8f8; --gold:#d9c58c; --good:#8fe3a0; --bad:#ff8f7d; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#191913;
  font-family: Fontin, Georgia, serif; color:var(--text); user-select:none; }
.panel { box-sizing:border-box; width:100%; height:100%; padding:8px 14px 20px; overflow-y:auto; }
.title { position:relative; display:flex; justify-content:space-between; font-size:13px; color:var(--gold);
  /* No room reserved for a close button any more: the form's title bar carries the ordinary one. */
  margin-bottom: 2px; }
/* The league sits in the middle of the header: absolute across the full width, so it is centred
   in the panel rather than pushed to the right edge by the name on the left. */
.title #league { position:absolute; left:0; right:0; text-align:center; }
/* The RU/EN switch sits at the right of the header and is drawn with the tabs' own look, so it reads as a
   control and not as a label; the active half takes the same "on" style as the tabs. */
.lang-switch { display:flex; gap:4px; align-items:center; }
.lang-switch .tab { font-size:10px; padding:1px 5px; }
.tabs { display:flex; gap:10px; margin:6px 0 4px; font-size:12px; }
.tab { cursor:pointer; color:var(--dim); padding:2px 8px; border:1px solid #3a3629; border-radius:3px; }
.tab.on { color:var(--gold); border-color:var(--gold); }
.name { font-size:16px; color:#dcd6c8; margin:2px 0 1px; }
.base { font-size:12px; color:#cfc9bb; }
.prop { font-size:12px; margin:1px 0; }
.dim { color:var(--dim); }
.mod { font-size:12.5px; color:var(--magic); margin:2px 0; }
.review-box { border:1px solid #3a3629; background:#1d1a12; padding:6px 10px; margin:6px 0; }
.review { font-size:12.5px; margin:1px 0; }
.review.ok { color:var(--good); }
.review.warn { color:#e0b979; }
.review.no { color:var(--bad); }
.review.new { color:var(--gold); font-size:12.5px; margin:6px 0; }
.rev-add { font-size:12px; color:var(--good); }
.rev-del { font-size:12px; color:var(--bad); }
.step { border:1px solid #5c5330; background:#221f16; padding:8px 10px; margin:8px 0 6px; }
.step-title { font-size:16px; color:var(--gold); margin-bottom:3px; }
.step-cost { font-size:12px; color:var(--good); margin-bottom:4px; }
.step-why { font-size:12.5px; margin-bottom:5px; }
.lesson { margin:4px 0 6px; font-size:12px; }
.lesson summary { cursor:pointer; color:var(--gold); }
.lesson-text { color:#bdb59f; padding:3px 0 0 10px; border-left:1px solid #3a3727; margin-top:3px; }
.branch { font-size:12px; margin:2px 0; }
.ok { color:var(--good); }
.no { color:var(--bad); }
.loop { font-size:12px; color:var(--gold); margin-top:6px; }
h3 { font-size:12.5px; color:var(--gold); margin:8px 0 3px; font-weight:normal; }
.warn { font-size:12px; margin:2px 0; color:#e0b979; }
.guide-row { font-size:12px; margin:2px 0; }
.empty-title { font-size:17px; color:var(--gold); margin:10px 0 8px; }
.empty-step { font-size:13px; margin:3px 0; }
.empty-hint { font-size:11.5px; color:var(--dim); margin-top:10px; line-height:1.5; }
.method { display:flex; gap:8px; font-size:12px; line-height:1.5; }
.method span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.method span:first-child { flex:2.1; }
.method span:nth-child(2) { flex:1.5; }
.method.head { color:var(--gold); font-size:11px; }
.method.head span { flex:1; }
.method.head span:first-child { flex:2.1; }
.method.head span:nth-child(2) { flex:1.5; }
.methods { max-height:140px; overflow-y:auto; }
/* Where a chance comes from matters more than the chance itself: Craft of Exile weights are
   measured on this very base, the Path of Building fallback is an estimate. */
/* flex:0 0 auto keeps the badge at its own width: the columns stretch, the mark must not. */
.src { flex:0 0 auto; font-size:10px; margin-left:4px; }
.src.exact { color:var(--good); }
.src.estimate { color:#e0b979; }
/* The same two colours in the legend line, where the words are text and not a badge. */
.legend { font-size:10px; }
.legend.exact { color:var(--good); }
.legend.estimate { color:#e0b979; }
.hint { position:absolute; bottom:4px; left:16px; font-size:10px; color:#6f6857; }
/* The methods picker: the method list stays on the left so choosing never scrolls the choices away. */
.split { display:grid; grid-template-columns:330px 1fr; gap:10px; align-items:start; }
.split .left { border-right:1px solid #2c2a1e; padding-right:8px; }
.mrow { display:flex; justify-content:space-between; gap:6px; padding:3px 6px;
  border-bottom:1px solid #221f16; cursor:pointer; }
.mrow:hover { background:#22221a; }
.mrow.on { background:#2b2a1d; border-left:2px solid var(--gold); }
.detail-title { color:#e7dfc8; font-size:13px; }
.modgrid { display:grid; grid-template-columns:2.6fr .5fr .6fr .8fr; gap:6px; }
.modgrid.head { color:#7d765f; font-size:10px; text-transform:uppercase; border-bottom:1px solid #3a3727; }
.modgrid > div { padding:2px 0; border-bottom:1px solid #23211a; font-size:11px; }
.actions { display:flex; gap:6px; margin-top:8px; }
.controls { display:flex; gap:4px; align-items:center; margin:6px 0; flex-wrap:wrap; }
.controls button.on { background:#3a3520; border-color:#8a7a3c; color:#f5eeda; }
/* A method the player's stage says to save: dimmed and marked, never hidden. */
.mrow.saved { opacity:.62; }
.save-mark { font-size:10px; color:#e0b979; border:1px solid #5a4a1c; border-radius:2px;
  padding:0 3px; margin-left:4px; }
.mode-switch { float:right; }
.mode-switch button { font-size:10px; padding:0 5px; margin-left:3px; }
.mode-switch button.on { background:#3a3520; border-color:#8a7a3c; color:#f5eeda; }
.more { margin-top:10px; border-top:1px solid #33301f; padding-top:6px; }
.more summary { cursor:pointer; color:var(--gold); font-size:12px; }
.howto { font-size:12px; color:#bdb59f; margin-top:10px; padding:8px 10px; border:1px solid #33301f; background:#1e1e17; line-height:1.55; }
.howto b { color:var(--gold); font-weight:normal; }
.stage-line { font-size:11.5px; color:#9a8d70; margin:0 0 4px; }
.stage-line b { color:var(--gold); font-weight:normal; }
.stage-switch { font-size:10.5px; color:#7d765f; margin:0 0 6px; }
.stage-switch button { font-size:10.5px; padding:1px 6px; }
.technique { margin:6px 0; border:1px solid #33301f; padding:5px 8px; background:#1e1e17; }
.technique summary { cursor:pointer; color:var(--gold); font-size:12px; }
.tech-step { font-size:11.5px; margin:4px 0 0 8px; color:#bdb59f; }
.tech-step b { color:#d8c98d; font-weight:normal; }
.league-note { font-size:10.5px; color:#c9a86a; margin-top:4px; border-left:2px solid #5a4a1c; padding-left:6px; }
.technique.done summary { color:#8fce8f; }
</style></head>

function renderReview(review){
  if(!review){return '';}
  if(!review.sameItem){
    return '<div class="review new">'+t('reviewNew')+'</div>';
  }
  const v=review.verdict||'nothing';
  const changes=review.changes||{added:[],removed:[]};
  const words={
    progress:t('reviewProgress'),
    nothing:t('reviewNothing'),
    loss:t('reviewLoss'),
    swap:t('reviewSwap')
  }[v]||'';
  const rows=[];
  rows.push('<div class="review '+(v==='progress'?'ok':(v==='nothing'?'warn':'no'))+'">'+esc(words)+'</div>');
  if((changes.added||[]).length){rows.push('<div class="rev-add">'+t('reviewAdded')+esc(changes.added.join('; '))+'</div>');}
  if((changes.removed||[]).length){rows.push('<div class="rev-del">'+t('reviewRemoved')+esc(changes.removed.join('; '))+'</div>');}
  rows.push('<div class="dim">'+t('reviewSame')+esc(changes.same||0)+t('reviewBefore')+esc((review.before||[]).length)+t('reviewAfter')+esc((review.after||[]).length)+'</div>');
  rows.push('<div class="dim">'+t('reviewPrevious')+esc(review.previousStep||'—')+'</div>');
  return '<div class="review-box">'+rows.join('')+'</div>';
}
// An engine that ANSWERED with an error is not an engine that stayed silent, and the two need different
// advice: a silent engine means it is not running, an erroring one means the item broke the analysis.
// Saying "did not answer" for both sent the customer looking at the wrong thing.
window.showEngineError=function(m){
  var text=String(m==null?'':m);
  var answered=/^\s*\.?[\\/]?.*\.lua:\d+:/.test(text)||/error|ошиб|bad argument/i.test(text);
  var head=answered?t('engineErrorAnswered'):t('engineErrorSilent');
  var tail=answered?t('engineErrorTail'):'';
  document.getElementById('step-view').innerHTML='<div class="prop no">'+esc(head+text+tail)+'</div>';
};

// Rouble-free rule: a price arrives as a set of currencies ("0.46 exalted + 0.01 chaos"). Only the
// largest one survives, because the table is narrow and the rest is noise.
function formatCost(raw){
  if(raw===undefined||raw===null){return '';}
  if(typeof raw!=='object'){return String(raw);}
  const parts=Object.keys(raw).map(k=>({key:k,value:Number(raw[k])}))
    .filter(p=>!Number.isNaN(p.value)&&p.value>=0.005)
    .sort((a,b)=>b.value-a.value);
  return parts.length ? parts[0].value.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+' '+parts[0].key : '—';
}

// The mark that says whether a chance can be trusted. "coe" means the weights were measured on
// Craft of Exile for this exact base; anything else is the tag-based estimate from Path of
// Building. The engine decides this (weightSource); the panel only draws it.
function sourceBadge(source, title){
  const hint = title ? ' title="'+esc(title)+'"' : '';
  if(source==='coe'){return '<span class="src exact"'+hint+'>'+t('exact')+'</span>';}
  if(source==='mixed'){return '<span class="src estimate"'+hint+'>'+t('mixed')+'</span>';}
  if(source){return '<span class="src estimate"'+hint+'>'+t('estimate')+'</span>';}
  return '';
}

// The reliability of the recommended step, taken from the method the step names. An exalt step and
// the "Exalted Orb" row of the engine's summary are the same craft, so they must not disagree.
function stepSourceBadge(summary, step){
  if(!summary||!step){return '';}
  const key=String(step.currency||'').toLowerCase();
  if(!key){return '';}
  const row=((summary.entries)||[]).filter(r=>r&&r.applicable===true)
    .filter(r=>String(r.label||'').toLowerCase()===key||String(r.method||'').toLowerCase()===key)[0];
  return row ? sourceBadge(row.weightSource, t('stepBadgeTitle')) : '';
}

// Every crafting method the engine priced for this item, next to the step it recommends. The
// reliability mark lives in the chance column, so a number is never read without its source.
function renderStepMethods(summary){
  const all=(summary&&summary.entries)||[];
  const rows=all.filter(r=>r&&r.applicable===true);
  if(!rows.length){return '';}
  const out=[];
  out.push('<h3>'+t('stepMethodsHead')+'</h3>');
  out.push('<div class="prop dim">'+t('appliesPrefix')+esc(summary.applicable)+t('ofWord')+esc(summary.total)
    +'. <span class="legend exact">'+t('exact')+'</span>'+t('legendExact')
    +'<span class="legend estimate">'+t('estimate')+'</span>'+t('legendEstimate')+'</div>');
  out.push('<div class="methods">');
  out.push('<div class="method head"><span>'+t('methodWord')+'</span><span>'+t('chanceWord')
    +'</span><span>'+t('priceWord')+'</span><span>'+t('attemptsColumn')+'</span></div>');
  rows.forEach(r=>{
    const chance=(r.chancePerAttempt===undefined||r.chancePerAttempt===null)
      ? '' : (Number(r.chancePerAttempt)*100).toFixed(2)+'%';
    const cost=formatCost(r.perAttempt!==undefined&&r.perAttempt!==null?r.perAttempt:r.cost);
    const attempts=(r.attemptsFor90===undefined||r.attemptsFor90===null)?'':String(r.attemptsFor90);
    out.push('<div class="method"><span>'+esc(r.label||r.method||'')+'</span>'
      +'<span>'+esc(chance)+sourceBadge(r.weightSource, r.weightSource==='coe'
        ? t('exactTitle') : t('estimateTitle'))+'</span>'
      +'<span>'+esc(cost)+'</span><span>'+esc(attempts)+'</span></div>');
  });
  out.push('</div>');
  return out.join('');
}

// ---- the methods picker (variant 3: method list left, modifiers right) -------------------------
// The engine computes every method that applies, its chance, its price in three currencies and its whole
// modifier pool. This screen arranges that data and nothing else, so its numbers cannot drift from the
// recommendation on the other tab. Choosing a method fills the right pane instead of replacing the list,
// which is what keeps the choices on screen while a long modifier list is read.
var methodsData=null;      // payload of the last capture
var methodsSel=null;       // the chosen method (an object, so the detail pane needs no lookup)
var methodsSort='chance';  // chance | price | name | mods  (methods) / chance | tier | name  (modifiers)
var methodsDesc=true;      // descending by default: best chance first
var methodsFilter='';      // text filter over modifiers
var methodsMinTier=0;      // 0 = any tier
var methodsShown=20;       // modifiers drawn so far: the rest follow the scrollbar

function priceText(rows){
  // Cheapest first, as the customer asked; four decimals keep a thousandth from printing as "0".
  if(!rows||!rows.length){return '—';}
  return rows.map(function(r){
    var amount=Number(r.amount);
    var text=amount>=1?String(Math.round(amount*100)/100):String(Math.round(amount*10000)/10000);
    return text+' '+esc(r.short||r.id);
  }).join(' · ');
}

function sortMethods(list){
  var arr=(list||[]).slice();
  arr.sort(function(a,b){
    var av,bv;
    if(methodsSort==='price'){av=(a.price&&a.price[0])?a.price[0].amount:Infinity;
      bv=(b.price&&b.price[0])?b.price[0].amount:Infinity;}
    else if(methodsSort==='name'){av=String(a.title||'').toLowerCase();bv=String(b.title||'').toLowerCase();
      return methodsDesc?(av<bv?1:(av>bv?-1:0)):(av<bv?-1:(av>bv?1:0));}
    else if(methodsSort==='mods'){av=Number(a.modCount)||0;bv=Number(b.modCount)||0;}
    else {av=Number(a.chance!==undefined&&a.chance!==null?a.chance:a.chancePerAttempt)||0;
      bv=Number(b.chance!==undefined&&b.chance!==null?b.chance:b.chancePerAttempt)||0;}
    return methodsDesc?bv-av:av-bv;
  });
  return arr;
}

function sortMods(list){
  var arr=(list||[]).slice();
  arr.sort(function(a,b){
    var av,bv;
    if(methodsSort==='tier'){av=Number(a.tier)||999;bv=Number(b.tier)||999;}
    else if(methodsSort==='name'){av=String(a.text||'').toLowerCase();bv=String(b.text||'').toLowerCase();
      return methodsDesc?(av<bv?1:(av>bv?-1:0)):(av<bv?-1:(av>bv?1:0));}
    else {av=Number(a.chance)||0;bv=Number(b.chance)||0;}
    return methodsDesc?bv-av:av-bv;
  });
  return arr;
}

function visibleMods(method){
  var all=sortMods(method&&method.mods).filter(function(mod){
    if(methodsMinTier>0&&(Number(mod.tier)||999)>methodsMinTier){return false;}
    if(!methodsFilter){return true;}
    return String(mod.text||'').toLowerCase().indexOf(methodsFilter)>=0;
  });
  return all;
}

function methodRow(method,current){
  var chance=(method.chance!==undefined&&method.chance!==null)
    ? Number(method.chance).toFixed(2)+'%'
    : (method.chancePerAttempt?(Number(method.chancePerAttempt)*100).toFixed(2)+'%':'—');
  // The chosen row is marked, not only tinted: two methods can legitimately share a name (a catalyst
  // can be both the quality step and a league option), and with only a background the click looked like
  // it had done nothing.
  //
  // A method the player's stage says to save is dimmed with a mark instead of disappearing: hiding it
  // would look like a bug and teach nothing, and he should learn WHY he is saving it.
  var saved=(method.allowedAtStage===false);
  var suffix=saved?' <span class="save-mark" title="'+esc(method.stageNote||'')+'">'+t('savedMark')+'</span>':'';
  return '<div class="mrow'+(current?' on':'')+(saved?' saved':'')
    +'" onclick="selectMethod(\''+esc(method.id)+'\')">'
    +'<span>'+(current?'✓ ':'')+esc(method.title)+suffix+'</span>'
    +'<span class="dim">'+esc(chance)+'</span></div>';
}

function renderMethodsList(){
  var out=[];
  var split=methodsData.split||{};
  out.push('<div class="dim">'+t('openPrefixes')+esc(split.openPrefixes!==null?split.openPrefixes:'?')
    +t('openSuffixes')+esc(split.openSuffixes!==null?split.openSuffixes:'?')+'</div>');
  (methodsData.groups||[]).forEach(function(group){
    var rows=sortMethods(group.methods);
    if(!rows.length){return;}
    var total=rows.reduce(function(sum,row){return sum+(Number(row.modCount)||0);},0);
    out.push('<h3>'+esc(group.title)+' <span class="dim">('+rows.length+' · '+total+t('modsShort')+')</span></h3>');
    rows.forEach(function(method){out.push(methodRow(method,methodsSel&&methodsSel.id===method.id));});
  });
  if(!(methodsData.groups||[]).length){
    out.push('<div class="prop dim">'+t('noMethods')+'</div>');
  }
  return out.join('');
}

function renderMethodDetail(){
  var method=methodsSel;
  if(!method){
    return '<div class="empty-step">'+t('detailPick')+'</div>';
  }
  var out=[];
  out.push('<div class="detail-title">'+esc(method.title)+'</div>');
  var bits=[];
  if(method.modCount){bits.push(esc(method.modCount)+t('modsShort'));}
  var chance=(method.chance!==undefined&&method.chance!==null)
    ? Number(method.chance).toFixed(2)+'%'
    : (method.chancePerAttempt?(Number(method.chancePerAttempt)*100).toFixed(2)+'%':null);
  if(chance){bits.push(t('chancePrefix')+esc(chance));}
  var price=priceText(method.price);

  if(method.oddsNote){out.push('<div class="prop dim">'+esc(method.oddsNote)+'</div>');}
  if(method.warning){out.push('<div class="branch no">'+esc(method.warning)+'</div>');}

  if((method.mods||[]).length){
    out.push('<div class="controls">'
      +'<input id="method-filter" placeholder="'+t('filterPlaceholder')+'" value="'+esc(methodsFilter)+'" '
      +'oninput="methodsFilter=this.value.toLowerCase();methodsShown=20;paintMethods()">'
      +'<button class="'+(methodsSort==='chance'?'on':'')+'" onclick="setSort(\'chance\')">'+t('chanceWord')+'</button>'
      +'<button class="'+(methodsSort==='tier'?'on':'')+'" onclick="setSort(\'tier\')">'+t('tierWord')+'</button>'
      +'<button class="'+(methodsSort==='name'?'on':'')+'" onclick="setSort(\'name\')">'+t('nameWord')+'</button>'
      +'<button onclick="flipOrder()">'+(methodsDesc?t('sortDesc'):t('sortAsc'))+'</button>'
      +'<button onclick="cycleTier()">'+(methodsMinTier?(t('tierAtMostPrefix')+methodsMinTier):t('anyTier'))+'</button>'
      +'</div>');
    var all=visibleMods(method);
    var rows=all.slice(0,methodsShown);
    out.push('<div class="modgrid head"><div>'+t('modWord')+'</div><div>'+t('tierWord')+'</div>'
      +'<div>'+t('chanceWord')+'</div><div>'+t('sourceWord')+'</div></div>');
    if(!rows.length){
      out.push('<div class="prop dim">'+t('noModsForFilter')+'</div>');
    }
    rows.forEach(function(mod){
      out.push('<div class="modgrid"><div>'+esc(mod.text)+'</div><div>T'+esc(mod.tier||'?')+'</div>'
        +'<div>'+esc(mod.chance)+'%</div>'
        +'<div>'+sourceBadge(mod.weightSource, mod.weightSource==='coe'
          ? t('exactTitle') : t('estimateTitle'))+'</div></div>');
    });
    if(rows.length<all.length){
      out.push('<div class="prop dim">'+t('shownPrefix')+rows.length+t('ofWord')+all.length
        +t('shownTail')+'</div>');
    } else {
      out.push('<div class="prop dim">'+t('shownAllPrefix')+all.length+t('shownAllTail')+'</div>');
    }
  } else if(method.oddsUnknown===false||method.oddsNote){
    out.push('<div class="prop dim">'+t('noModPick')+'</div>');
  }
  out.push('<div class="actions">'
    +'<button onclick="confirmStep(\'done\')">'+t('doneButton')+'</button>'
    +'<button onclick="confirmStep(\'failed\')">'+t('failedButton')+'</button>'
    +'</div>');
  return out.join('');
}

function paintMethods(){
  var view=document.getElementById('methods-view');
  if(!view){return;}
  // The scroll position is restored on the REAL scroller. Using the view's parent looked right and was
  // wrong: the parent is not what scrolls, so every repaint jumped the panel back to the top - which is
  // what made scrolling for more modifiers impossible.
  var scroller=methodsScroller();
  var wasAt=scroller?scroller.scrollTop:0;
  view.innerHTML=renderMethodsView();
  if(scroller){scroller.scrollTop=wasAt;}
}

function selectMethod(id){
  var found=null;
  ((methodsData&&methodsData.groups)||[]).forEach(function(group){
    (group.methods||[]).forEach(function(row){if(row.id===id){found=row;}});
  });
  if(!found){return;}
  methodsSel=found;
  methodsShown=20;   // a new choice starts from the top of its own list
  paintMethods();
}
function setSort(which){methodsSort=which;paintMethods();}
function flipOrder(){methodsDesc=!methodsDesc;paintMethods();}
function cycleTier(){methodsMinTier=methodsMinTier===0?3:(methodsMinTier===3?1:0);methodsShown=20;paintMethods();}

// The stage is a judgement the ENGINE makes (from the item level) or the player makes by choosing. It is
// not filtered here: the choice goes back to the host, the item is analysed again with it, and the panel
// draws whatever comes back - so the rules for what to save live in one place.
function setStage(stage){
  if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage('stage:'+stage);}
}

// "Failed": the customer asked for the ways to free the side rather than a repeat of the same
// method, and the picker already lists them, so this points at them instead of inventing a step.
function confirmStep(outcome){
  var name=methodsSel?methodsSel.title:t('fallbackMethod');
  var box=document.getElementById('step-view');
  var message=outcome==='done'
    ? t('confirmDone')+name+t('confirmDoneTail')
    : t('confirmFailed')+name+t('confirmFailedTail');
  if(box){
    box.innerHTML='<div class="step"><div class="step-title">'+esc(message)+'</div>'
      +'<div class="loop">'+t('openMethodsHint')+'</div></div>';
  }
  showTab('step');
}

// Scrolling inside the panel reveals the rest of a long modifier list, as the customer asked: the first
// twenty rows are drawn and the remainder follows the scrollbar instead of a button.
//
// The scroller is the panel itself (".panel" has overflow-y), NOT the window, and a scroll inside an
// element never reaches a window listener without capturing - which is why the customer scrolled and
// nothing loaded. The listener is registered with capture:true (see the bottom of this script), and this
// function finds the real scroller by walking up from the picker instead of assuming its parent.
function methodsScroller(){
  var node=document.getElementById('methods-view');
  while(node&&node!==document.body){
    var style=window.getComputedStyle(node);
    var overflowY=style?style.overflowY:'';
    if((overflowY==='auto'||overflowY==='scroll')&&node.scrollHeight>node.clientHeight+4){
      return node;
    }
    node=node.parentNode;
  }
  return document.scrollingElement||document.documentElement;
}

function methodsOnScroll(){
  if(!methodsData||!methodsSel){return;}
  var view=document.getElementById('methods-view');
  if(!view||view.style.display==='none'){return;}
  var scroller=methodsScroller();
  if(!scroller){return;}
  if(scroller.scrollTop+scroller.clientHeight<scroller.scrollHeight-40){return;}
  var all=visibleMods(methodsSel);
  if(methodsShown<all.length){methodsShown=methodsShown+20;paintMethods();}
}

// The whole screen comes from the engine: the step it recommends, the warnings that apply to this
// item, and the reference. Nothing is computed here.
// "Craft or buy?" - every guide says answer this BEFORE spending. The panel can only compute the craft side:
// the price snapshot has never carried rare items, so it shows the cost, the search recipe and the rule, and
// says plainly that the finished-item price has to be looked up. A fabricated buy price would be worse than
// none.
function renderCraftOrBuy(block){
  if(!block){return '';}
  var parts=['<h3>'+t('craftOrBuyHead')+'</h3>'];
  if(block.hasCost&&block.cheapest){
    var c=block.cheapest;
    var cost=(c.expectedCost&&c.expectedCost.chaos!==undefined)
      ? Number(c.expectedCost.chaos).toFixed(2) : '—';
    parts.push('<div class="step-why"><b>'+esc(c.method)+'</b>'+t('expectedPrefix')+esc(cost)
      +t('expectedMiddle')+esc(String(c.expectedAttempts||'?'))+t('attemptsSuffix')
      +(c.costFor90?t('costFor90Prefix')+esc(Number(c.costFor90.chaos).toFixed(2))+t('costFor90Tail'):'')+'.</div>');
  } else {
    parts.push('<div class="step-why dim">'+t('noCost')+'</div>');
  }
  // Routes we cannot price are named rather than ranked: a lower bound is not a price.
  (block.unpriced||[]).forEach(function(route){
    parts.push('<div class="branch no">'+esc(route.method)+t('unknownPrice')
      +esc((route.missing||[]).join(', '))+'</div>');
  });
  if(block.recipe&&(block.recipe.stats||[]).length){
    parts.push('<div class="dim" style="margin-top:4px">'+t('tradeSearch')+'</div>');
    parts.push('<div class="lesson-text">'+esc(block.recipe.class||'')+t('itemLevelPrefix')
      +esc(String(block.recipe.itemLevel||'?'))+' · '+esc(block.recipe.rarity||'')+'<br>'
      +(block.recipe.stats||[]).map(function(stat){
        return '• '+esc(stat.text)+(stat.tier?(' ('+t('tierSpaced')+esc(String(stat.tier))+')'):'');
      }).join('<br>')+'</div>');
  }
  if(block.rule){parts.push('<div class="step-why" style="margin-top:5px">'+esc(block.rule)+'</div>');}
  // The half of the comparison we cannot compute: what the finished item actually sells for. The player
  // looks it up and types it, and then the decision is real arithmetic on two known numbers instead of a rule
  // of thumb. The panel never guesses a market price.
  if(block.hasCost){
    parts.push('<div class="controls"><input id="buy-input" placeholder="'+t('buyPlaceholder')+'" '
      +'style="flex:1;min-width:150px" onkeydown="if(event.key===\'Enter\')askBuy()">'
      +'<button onclick="askBuy()">'+t('compareButton')+'</button>'
      +'<button onclick="askAutoPrice()" title="'+t('autoPriceTitle')+'">'+t('priceButton')+'</button>'
      +'</div><div id="buy-verdict"></div>');
  }
  if(block.priceNote){parts.push('<div class="dim">'+esc(block.priceNote)+'</div>');}
  return parts.join('');
}

// Ask the host to compare the craft cost with the price the player just looked up.
function askBuy(){
  var input=document.getElementById('buy-input');
  var value=input?String(input.value).replace(',','.').trim():'';
  if(!value){return;}
  if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage('buy:'+value);}
  buyPending='calculating';
  paintBuyVerdict();
}

// Ask the host to price the item on the live trade site instead of asking the player.
function askAutoPrice(){
  if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage('autoprice');}
  buyPending='askingTrade';
  paintBuyVerdict();
}

// The engine's verdict, cached so a language switch can redraw it without asking the engine again.
// It always says that the craft cost is an average and that the price came from the player, because a
// comparison is only as honest as its inputs.
var lastBuyVerdict=null;   // {verdict, priceNote} of the last answer; null before the first one
var buyPending=null;       // key of the placeholder shown while the host works, or null
function paintBuyVerdict(){
  var box=document.getElementById('buy-verdict');
  if(!box){return;}
  if(buyPending){box.innerHTML='<div class="guide-row dim">'+t(buyPending)+'</div>';return;}
  if(!lastBuyVerdict){box.innerHTML='';return;}
  var verdict=lastBuyVerdict.verdict;
  var priceNote=lastBuyVerdict.priceNote;
  if(!verdict||!verdict.verdict){
    var why=verdict&&verdict.text?esc(verdict.text):t('nothingToCompare');
    box.innerHTML='<div class="branch no">'+why+'</div>';
    return;
  }
  var css=verdict.verdict==='buy'?'no':(verdict.verdict==='craft'?'ok':'');
  box.innerHTML='<div class="branch '+css+'">'+esc(verdict.text||'')+'</div>'
    +'<div class="dim">'+esc(verdict.line||'')+'</div>'
    +(priceNote?'<div class="dim">'+esc(priceNote)+'</div>':'')
    +'<div class="dim">'+esc(verdict.note||'')+'</div>';
}
window.showBuyVerdict=function(verdict, priceNote){
  lastBuyVerdict={verdict:verdict, priceNote:priceNote};
  buyPending=null;
  paintBuyVerdict();
};

// Beginner mode beats showing everything. The complaint that started this was not "the panel lacks features"
// but "I still do not understand how to use it", and seven blocks at once is why. Default ON; the choice is
// remembered, and "Everything" restores the full card for anyone who wants it.
var beginnerMode=(function(){try{return localStorage.getItem('poe2craft.beginner')!=='0';}catch(e){return true;}})();
var lastCoach=null;        // the payload of the last showCoach call: the step card is redrawn from it
var lastGuide=null;        // the guide payload, for the same reason on the reference tab
function setBeginner(on){
  beginnerMode=!!on;
  try{localStorage.setItem('poe2craft.beginner', beginnerMode?'1':'0');}catch(e){}
  if(lastCoach){window.showCoach(lastCoach.report,lastCoach.analysis,lastCoach.client,lastCoach.guide);}
}

// ---- language ----------------------------------------------------------------------------------------
// The switch only ASKS the host and never changes the page itself: the host answers with setLanguage after
// it has re-asked the engine for its text, so the page and the engine cannot end up in different languages.
function chooseLanguage(code){
  if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage('lang:'+code);}
}

// The one place that decides what language the page is in. Only chrome is redrawn, and only from data already
// held: the engine is asked by the host, not from here, and the engine's own text is left exactly as it came.
window.setLanguage=function(code){
  LANG=(code==='en')?'en':'ru';
  document.documentElement.lang=LANG;
  // What the player has typed lives only in the inputs, so the redraw carries it across by hand: losing a
  // price he just looked up in the trade site would make the switch feel like a reset.
  var typedBuy=inputValue('buy-input');
  var typedClaim=inputValue('claim-input');
  paintChrome();
  if(lastCoach){
    // The step card holds the review, the step, the state, the warnings and the item: re-running showCoach
    // with the payload it was given is the same render, in the new language.
    window.showCoach(lastCoach.report,lastCoach.analysis,lastCoach.client,lastCoach.guide);
  } else {
    document.getElementById('step-view').innerHTML=renderEmptyStep();
    document.getElementById('guide-view').innerHTML='';
  }
  paintMethods();
  if(lastGuide){renderGuide(lastGuide);}
  restoreInput('buy-input', typedBuy);
  restoreInput('claim-input', typedClaim);
  if(claimPending||lastClaimAnswer!==undefined){paintClaimAnswer();}
  if(buyPending||lastBuyVerdict){paintBuyVerdict();}
};

function inputValue(id){
  var node=document.getElementById(id);
  return node?String(node.value):'';
}
function restoreInput(id, value){
  var node=document.getElementById(id);
  if(node&&value){node.value=value;}
}

window.showCoach=function(report, analysis, client, guide){
  // The methods payload arrives with the analysis, so the picker costs no extra engine call. The
  // previous choice is kept when the item is still the same, because a capture right after a step
  // should show that same method's updated numbers rather than jump back to the first one.
  methodsData=(analysis&&analysis.methods)||null;
  var previous=methodsSel?methodsSel.id:null;
  methodsSel=null;
  if(previous&&methodsData){selectMethod(previous);}
  if(!methodsSel&&methodsData&&(methodsData.groups||[]).length){
    var firstGroup=methodsData.groups[0];
    var firstMethod=(firstGroup.methods||[])[0];
    if(firstMethod){selectMethod(firstMethod.id);}
  }

  if(!report){window.showEngineError(t('emptyAnswer'));return;}
  lastCoach={report:report,analysis:analysis,client:client,guide:guide};
  const item=(analysis&&analysis.item)||{};
  const header=(client&&client.header)||{};
  const parts=[];
  const extras=[];
  parts.push('<div class="name">'+esc(header.name||item.name||'')+'</div>');
  parts.push('<div class="base">'+esc(header.base||item.baseType||'')+''
    +'<span class="mode-switch"><button onclick="setBeginner(true)" class="'+(beginnerMode?'on':'')+'">'+t('beginnerButton')+'</button>'
    +'<button onclick="setBeginner(false)" class="'+(beginnerMode?'':'on')+'">'+t('everythingButton')+'</button></span></div>');

  const step=report.step||{};
  (beginnerMode?extras:parts).push(renderReview(report.review));
  parts.push('<div class="step">');
  parts.push('<div class="step-title">'+esc(step.title||t('noStep'))+'</div>');
  if(step.costLine){parts.push('<div class="step-cost">'+esc(step.costLine)+stepSourceBadge(analysis&&analysis.craftSummary, step)+'</div>');}
  if(step.why){parts.push('<div class="step-why">'+esc(step.why)+'</div>');}
  // The lesson states the principle behind the action, which is what makes the player independent of the
  // tool next time. It is collapsed by default: a beginner who only wants the next click should not have to
  // scroll past a paragraph, and one who wants to learn opens it once.
  if(step.lesson){
    parts.push('<details class="lesson"><summary>'+(step.lessonTitle?esc(step.lessonTitle):t('lessonTitle'))+'</summary>'
      +'<div class="lesson-text">'+esc(step.lesson)+'</div></details>');
  }
  (beginnerMode?extras:parts).push(
    (step.ifSuccess?'<div class="branch ok">'+t('ifSuccess')+esc(step.ifSuccess)+'</div>':'')
    +(step.ifFail?'<div class="branch no">'+t('ifFail')+esc(step.ifFail)+'</div>':''));
  parts.push(renderCraftOrBuy(report.craftOrBuy));
  // The two answers the loop needs, on the screen where the step is read. They used to live only inside the
  // method detail on the "Methods" tab, so a beginner had to know where to look to report what happened.
  parts.push('<div class="actions">'
    +'<button onclick="confirmStep(\'done\')">'+t('doneButton')+'</button>'
    +'<button onclick="confirmStep(\'failed\')">'+t('failedButton')+'</button>'
    +'</div>');
  parts.push('<div class="loop">'+t('afterStep')+'</div>');
  parts.push('</div>');

  const state=report.state||{};
  extras.push('<h3>'+t('stateTakenHead')+'</h3>');
  const slots = state.splitKnown
    ? t('openPrefixes')+state.openPrefixes+t('openSuffixes')+state.openSuffixes
    : t('openSlotsPrefix')+state.openSlots+t('openSlotsTail');
  extras.push(lines(slots
    +'\n'+t('craftedSlot')+(state.craftedAnchorUsed?t('taken'):t('open'))
    +t('desecratedSlot')+(state.desecratedAnchorUsed?t('taken'):t('open'))
    +'\n'+t('modifiablePrefix')+(state.modifiable===false?t('modifiableNo'):t('yes'))
    +(state.corrupted?'\n'+t('corruptedLine'):''),'guide-row'));

  const warnings=report.warnings||[];
  if(warnings.length){
    extras.push('<h3>'+t('warningsHead')+' ('+warnings.length+')</h3>');
    warnings.forEach(w=>extras.push('<div class="warn">• '+esc(w.text)+'</div>'));
  }

  if(client&&((client.properties||[]).length||(client.mods||[]).length)){
    extras.push('<h3>'+t('itemHead')+'</h3>');
    (client.properties||[]).forEach(p=>extras.push('<div class="prop">'+esc(p.label+': '+p.value)+'</div>'));
    (client.mods||[]).forEach(m=>extras.push('<div class="mod"'+(m.fractured?' style="color:var(--gold)"':'')+'>'+esc(m.text)+'</div>'));
    if(client.flags&&client.flags.corrupted){extras.push('<div class="prop no">'+t('corruptedFlag')+'</div>');}
    // The state that closes an item to further crafting, shown where the item is: without this line
    // an item that cannot be crafted looks like any other and the missing step looks like a bug.
    if(client.flags&&client.flags.sanctified){extras.push('<div class="prop no">'+t('sanctifiedFlag')+'</div>');}
  }
  // The menus of methods sit last on purpose: with them first the "what is already taken" and
  // "what not to touch" blocks fell below the fold, and those decide the next click.
  extras.push(renderStepMethods(analysis&&analysis.craftSummary));

  // Beginner mode keeps one question on screen - what do I do now - and puts the rest behind one click. The
  // count is in the summary so nothing is hidden silently: a warning the player never sees is worse than a
  // warning below the fold.
  if(beginnerMode){
    const hidden=[];
    if(warnings.length){hidden.push(warnings.length+t('warningsShort'));}
    hidden.push(t('hiddenTaken'),t('hiddenItem'),t('hiddenMethods'));
    parts.push('<details class="more"><summary>'+t('showAllPrefix')+hidden.join(' · ')+'</summary>'
      +extras.join('')+'</details>');
  } else {
    parts.push(extras.join(''));
  }

  document.getElementById('step-view').innerHTML=parts.join('');
  const league=((analysis&&analysis.craftSummary)||{}).league;
  if(league){document.getElementById('league').textContent=t('leaguePrefix')+league;}
  if(guide){lastGuide=guide;renderGuide(guide);}
};

function renderGuide(g){
  const out=[];
  out.push('<div class="guide-row dim">'+esc(g.league||'')+t('bySources')+'</div>');
  out.push('<h3>'+t('mainRuleHead')+'</h3><div class="guide-row">'+esc(g.mainRule||'')+'</div>');
  out.push('<h3>'+t('capsHead')+'</h3>');
  (g.caps||[]).forEach(c=>out.push('<div class="guide-row"><b>'+esc(c.title)+'</b><br>'+esc(c.text)+'</div>'));
  out.push('<h3>'+t('currenciesHead')+'</h3>');
  (g.orbs||[]).forEach(o=>out.push('<div class="guide-row"><b>'+esc(o.name)+'</b> — '+esc(o.does)
    +'<br><span class="dim">'+t('whenPrefix')+esc(o.when)+t('riskGuide')+esc(o.risk)+'</span></div>'));
  out.push('<h3>'+t('omensHead')+'</h3>');
  ((g.omens||{}).entries||[]).forEach(o=>out.push('<div class="guide-row"><b>'+esc(o.name)+'</b> — '+esc(o.does)
    +'<br><span class="dim">'+t('whyPrefix')+esc(o.why)+'</span></div>'));
  if(g.tiers){out.push('<h3>'+esc(g.tiers.title)+'</h3><div class="guide-row">'+esc(g.tiers.text)+'</div>');}
  if(g.essence){out.push('<h3>'+esc(g.essence.title)+'</h3><div class="guide-row">'+esc(g.essence.text)+'</div>');}
  if(g.groups){out.push('<h3>'+esc(g.groups.title)+'</h3><div class="guide-row">'+esc(g.groups.text)+'</div>');}
  if(g.desecration){out.push('<h3>'+esc(g.desecration.title)+'</h3><div class="guide-row">'+esc(g.desecration.text)+'</div>');}
  if(g.alloys){out.push('<h3>'+esc(g.alloys.title)+'</h3><div class="guide-row">'+esc(g.alloys.text)+'</div>');}
  out.push('<h3>'+t('mistakesHead')+'</h3>');
  (g.mistakes||[]).forEach(m=>out.push('<div class="warn">• '+esc(m.text)+'</div>'));
  out.push('<h3>'+t('loopHead')+'</h3>');
  (g.loop||[]).forEach(l=>out.push('<div class="guide-row">'+esc(l)+'</div>'));
  // The Genesis Tree: since 0.5.0 catalysts do not drop from monsters, so this is where jewellery quality
  // comes from. Shown with expected births, because "how many tries" is what decides whether to do it at all.
  if(g.genesisTree){
    out.push('<h3>GENESIS TREE</h3>');
    out.push('<div class="guide-row dim">'+esc(g.genesisTree.location||'')+'</div>');
    (g.genesisTree.goals||[]).forEach(function(goal){
      var tries=goal.expectedBirths?(' · ~'+esc(String(goal.expectedBirths))+t('births')):'';
      var chance=(goal.chance!==undefined)?(' · '+esc((Number(goal.chance)*100).toFixed(1))+'%'):'';
      out.push('<div class="guide-row"><b>'+esc(goal.title)+'</b> — '+esc(goal.wombgift||'')
        +chance+tries+'</div>');
    });
    (g.genesisTree.notes||[]).forEach(function(note){
      out.push('<div class="warn">• '+esc(note)+'</div>');
    });
  }
  // "Is this true?" - the question a beginner cannot answer alone, and the one that protects him from the
  // fabricated guides found while researching the topic. The answer comes from the engine, not from here.
  out.push('<h3>'+t('claimsHead')+'</h3>');
  out.push('<div class="guide-row dim">'+t('claimIntro')+'</div>');
  out.push('<div class="controls"><input id="claim-input" placeholder="'+t('claimPlaceholder')+'" '
    +'style="flex:1;min-width:180px" onkeydown="if(event.key===\'Enter\')askClaim()">'
    +'<button onclick="askClaim()">'+t('checkButton')+'</button></div>');
  out.push('<div id="claim-answer"></div>');
  if(g.claims&&g.claims.length){
    // Say how many of the traps our own ruleset settles: a claim we merely wrote down is weaker evidence
    // than one the data contradicts, and the player should know which he is looking at.
    var checked=(g.claimsChecked&&g.claimsChecked.checked)||0;
    out.push('<div class="guide-row dim" style="margin-top:6px">'+t('knownTraps')
      +(checked?(' — '+checked+t('ofWord')+g.claims.length+t('trapsCheckedTail')):'')+':</div>');
    g.claims.filter(c=>c.verdict==='false').forEach(function(c){
      out.push('<div class="warn">• '+esc(c.title)+'</div>');
    });
  }
  document.getElementById('guide-view').innerHTML=out.join('');
}

// The question goes to the host, which asks the engine: the rules for what is true live in one place, and the
// page must not become a second opinion.
var lastClaimAnswer;       // undefined = never answered on this page; null = the host answered "no answer"
var claimPending=false;    // the answer is still on its way
function askClaim(){
  var input=document.getElementById('claim-input');
  var text=input?input.value.trim():'';
  if(!text){return;}
  if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage('claim:'+text);}
  claimPending=true;
  paintClaimAnswer();
}

// The engine's verdict, shown with its reason and where it comes from. Cached, so a language switch redraws
// it from the same answer instead of asking again.
function paintClaimAnswer(){
  var box=document.getElementById('claim-answer');
  if(!box){return;}
  if(claimPending){box.innerHTML='<div class="guide-row dim">'+t('claimChecking')+'</div>';return;}
  var answer=lastClaimAnswer;
  if(!answer){box.innerHTML='<div class="guide-row dim">'+t('noAnswer')+'</div>';return;}
  if(answer.known===false){
    box.innerHTML='<div class="branch no">'+t('nothingToCheck')+esc(answer.why||'')+'</div>';
    return;
  }
  var right=answer.verdict==='true';
  box.innerHTML='<div class="branch '+(right?'ok':'no')+'">'
    +(right?t('correctPrefix'):t('wrongPrefix'))+esc(answer.title||'')+'</div>'
    +'<div class="guide-row">'+esc(answer.why||'')+'</div>'
    +'<div class="guide-row dim">'+t('sourcePrefix')+esc(answer.source||'')
    +(answer.verified?t('verifiedMark'):t('manualMark'))
    +'</div>';
}
window.showClaimAnswer=function(answer){
  lastClaimAnswer=answer||null;
  claimPending=false;
  paintClaimAnswer();
};

// Draw the page's own chrome the moment this script is parsed: the markup carries no words of its own, so not
// one frame can be painted in the wrong language. The host calls setLanguage again once it knows the
// player's choice, and that is the only thing that ever changes LANG afterwards.
paintChrome();
document.getElementById('step-view').innerHTML=renderEmptyStep();
</script>
<script>
  (function () {
    // Drag the window by its top strip. Offsets are sent as whole pixels so the move stays exact.
    // The panel draws no close control of its own any more: the form's title bar carries the
    // ordinary one, and a second drawn cross in the corner only duplicated it.
    var last = null;
    function send(dx, dy) {
      if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('drag:' + dx + ':' + dy); }
    }
    document.addEventListener('mousedown', function (e) {
      if (e.clientY <= 22) { last = { x: e.screenX, y: e.screenY }; e.preventDefault(); }
    });
    document.addEventListener('mousemove', function (e) {
      if (!last) { return; }
      // The left button must still be held: a mouseup outside the page would otherwise leave the
      // window following the cursor for the rest of the session, which looked like the panel
      // emptying itself whenever the pointer moved past it.
      if (!(e.buttons & 1)) { last = null; return; }
      var dx = e.screenX - last.x, dy = e.screenY - last.y;
      if (dx || dy) { last = { x: e.screenX, y: e.screenY }; send(dx, dy); }
    });
    document.addEventListener('mouseup', function () { last = null; });
  // The picker draws twenty modifiers and loads the rest when the panel is scrolled to the end.
  window.addEventListener('scroll', methodsOnScroll, true);
    document.addEventListener('mouseleave', function () { last = null; });
